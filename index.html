<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McTiers - Rankings by _648k</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2eDR0yD1n0J0jT/rP4KaxX762qLgq8B2qP80q5z8A05nC/z2g5K37+z33a==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --mocha-bg: #1e1e2e;
            --mocha-crust: #28283d;
            --mocha-surface: #313244;
            --mocha-border: #45475a;
            --mocha-text: #cdd6f4;
            --mocha-subtext: #bac2de;
            --mocha-blue: #89b4fa;
            --mocha-green: #a6da95;
            --mocha-gold: #f9e2af;
            --mocha-pink: #f4b8e4;
            --mocha-red: #f2cdcd;
            --mocha-lavender: #b7b7ff;
            --mocha-dark-text: #4c526f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--mocha-bg);
            color: var(--mocha-text);
        }

        .container {
            max-width: 1200px;
        }

        .header-bg {
            background-color: var(--mocha-crust);
        }

        .card {
            background-color: var(--mocha-crust);
            border-radius: 1rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .tier-label {
            background-color: var(--mocha-surface);
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .tier-ht1 { color: var(--mocha-gold); }
        .tier-lt1 { color: #f2e7c4; }
        .tier-ht2 { color: var(--mocha-green); }
        .tier-lt2 { color: #b7e3a9; }
        .tier-ht3 { color: var(--mocha-pink); }
        .tier-lt3 { color: #ebacdb; }
        .tier-ht4 { color: var(--mocha-red); }
        .tier-lt4 { color: #e8c0c0; }
        .tier-ht5 { color: var(--mocha-lavender); }
        .tier-lt5 { color: #c4c4e7; }
        .tier-none { color: var(--mocha-dark-text); }

        .loading-spinner {
            border: 4px solid var(--mocha-border);
            border-top: 4px solid var(--mocha-blue);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: var(--mocha-crust);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--mocha-surface);
            border-radius: 10px;
            border: 3px solid var(--mocha-crust);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #45475a;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen">
    <div class="container mx-auto p-4 md:p-8">
        <header class="flex justify-between items-center py-4 header-bg rounded-xl px-6 mb-8 shadow-lg">
            <h1 class="text-3xl md:text-4xl font-extrabold text-white">McTiers</h1>
            <div class="flex items-center space-x-4">
                <a href="#" class="text-gray-400 hover:text-white transition-colors">Rankings</a>
                <a href="#" class="text-gray-400 hover:text-white transition-colors">Discord</a>
                <input type="text" id="searchInput" placeholder="Search player..." class="bg-gray-800 text-gray-300 rounded-md py-1 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>
        </header>

        <div class="flex flex-col md:flex-row md:justify-between items-center bg-gray-900 rounded-xl p-4 md:p-6 mb-8 text-sm md:text-base shadow-lg">
            <div class="flex flex-wrap gap-4 text-gray-400">
                <button class="bg-gray-800 text-white font-bold py-2 px-4 rounded-lg focus:outline-none">Overall</button>
                <button class="hover:bg-gray-800 py-2 px-4 rounded-lg transition-colors">LTMs</button>
                <button class="hover:bg-gray-800 py-2 px-4 rounded-lg transition-colors">Vanilla</button>
                <button class="hover:bg-gray-800 py-2 px-4 rounded-lg transition-colors">UHC</button>
                <button class="hover:bg-gray-800 py-2 px-4 rounded-lg transition-colors">Pot</button>
                <button class="hover:bg-gray-800 py-2 px-4 rounded-lg transition-colors">NethPot</button>
                <button class="hover:bg-gray-800 py-2 px-4 rounded-lg transition-colors">SMP</button>
                <button class="hover:bg-gray-800 py-2 px-4 rounded-lg transition-colors">Sword</button>
                <button class="hover:bg-gray-800 py-2 px-4 rounded-lg transition-colors">Axe</button>
            </div>
            <div class="hidden md:flex flex-row space-x-4 mt-4 md:mt-0 items-center justify-end w-full md:w-auto text-gray-400">
                <p>SERVER: <span class="font-bold text-white">mc.pvp.club</span></p>
                <p>PLAYERS: <span class="font-bold text-white">_648k</span></p>
            </div>
        </div>

        <div class="flex items-center space-x-2 md:space-x-4 px-4 md:px-8 mb-4 md:mb-6">
            <div class="w-12 md:w-16"></div> <div class="w-16 md:w-20"></div> <div class="flex-1 min-w-0"></div> <div class="w-16 md:w-24 text-center"></div> <div class="flex-shrink-0 flex items-center justify-start space-x-2 md:space-x-4">
                <div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 rounded-full flex items-center justify-center bg-purple-500 text-white text-xs md:text-sm">
                    <i class="fa-solid fa-wand-magic-sparkles" title="Sword"></i>
                </div>
                <div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 rounded-full flex items-center justify-center bg-red-500 text-white text-xs md:text-sm">
                    <i class="fa-solid fa-shield-halved" title="Axe"></i>
                </div>
                <div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 rounded-full flex items-center justify-center bg-blue-500 text-white text-xs md:text-sm">
                    <i class="fa-solid fa-flask" title="PotPvP"></i>
                </div>
                <div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 rounded-full flex items-center justify-center bg-green-500 text-white text-xs md:text-sm">
                    <i class="fa-solid fa-gem" title="UHC"></i>
                </div>
                <div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 rounded-full flex items-center justify-center bg-yellow-500 text-white text-xs md:text-sm">
                    <i class="fa-solid fa-hand-fist" title="Crystal"></i>
                </div>
                <div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 rounded-full flex items-center justify-center bg-pink-500 text-white text-xs md:text-sm">
                    <i class="fa-solid fa-fire" title="NethPot"></i>
                </div>
                <div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 rounded-full flex items-center justify-center bg-orange-500 text-white text-xs md:text-sm">
                    <i class="fa-solid fa-tree" title="SMP"></i>
                </div>
            </div>
        </div>
        
        <div id="loadingIndicator" class="flex flex-col justify-center items-center py-12">
            <div class="loading-spinner"></div>
            <p class="mt-4 text-gray-400 text-lg animate-pulse">Loading ranks...</p>
        </div>

        <div id="rankings-container" class="space-y-4">
            </div>
        
        <p id="noResults" class="text-center text-red-400 py-12 hidden text-lg">No players found matching your criteria.</p>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const rankingsContainer = document.getElementById('rankings-container');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const noResults = document.getElementById('noResults');

        let allPlayers = [];

        const gamemodeOrder = ["Sword", "Axe", "PotPvP", "UHC", "Crystal", "NethPot", "SMP"];

        function getTierClass(tier) {
            switch(tier) {
                case 'HT1': return 'tier-ht1';
                case 'LT1': return 'tier-lt1';
                case 'HT2': return 'tier-ht2';
                case 'LT2': return 'tier-lt2';
                case 'HT3': return 'tier-ht3';
                case 'LT3': return 'tier-lt3';
                case 'HT4': return 'tier-ht4';
                case 'LT4': return 'tier-lt4';
                case 'HT5': return 'tier-ht5';
                case 'LT5': return 'tier-lt5';
                default: return 'tier-none';
            }
        }

        async function fetchRankings() {
            loadingIndicator.classList.remove('hidden');
            rankingsContainer.innerHTML = '';
            noResults.classList.add('hidden');

            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Failed to fetch data.');
                allPlayers = await response.json();
                
                // Sort players by points in descending order
                allPlayers.sort((a, b) => b.points - a.points);
                
                displayRankings();
            } catch (error) {
                console.error("Could not fetch player rankings:", error);
                noResults.classList.remove('hidden');
                noResults.textContent = 'Failed to load player data. Please ensure data.json is available.';
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        function displayRankings() {
            rankingsContainer.innerHTML = '';
            noResults.classList.add('hidden');

            const searchTerm = searchInput.value.toLowerCase();
            let filteredPlayers = allPlayers.filter(player => player.username.toLowerCase().includes(searchTerm));

            if (filteredPlayers.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }

            let lastPoints = null;
            let currentRank = 1;
            let tiedRank = 1;

            filteredPlayers.forEach((player, index) => {
                if (lastPoints !== null && player.points < lastPoints) {
                    currentRank = index + 1;
                    tiedRank = currentRank;
                } else if (lastPoints !== null && player.points === lastPoints) {
                    currentRank = tiedRank;
                } else {
                    currentRank = index + 1;
                    tiedRank = currentRank;
                }

                lastPoints = player.points;

                const tiersHtml = gamemodeOrder.map(gamemode => {
                    const tier = player.tiers[gamemode] || '-';
                    const tierClass = getTierClass(tier);
                    return `<div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 flex items-center justify-center">
                                <span class="tier-label ${tierClass} text-center">${tier}</span>
                            </div>`;
                }).join('');

                const playerCard = document.createElement('div');
                playerCard.classList.add('card', 'p-4', 'md:p-6', 'flex', 'items-center', 'space-x-4');
                playerCard.innerHTML = `
                    <div class="w-12 md:w-16 flex-shrink-0 text-3xl font-bold text-center text-white">
                        <p>${currentRank}.</p>
                    </div>
                    <div class="w-16 md:w-20 flex-shrink-0">
                        <img src="${player.skin}" alt="${player.username}'s skin" class="rounded-lg w-full">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h2 class="text-xl md:text-2xl font-extrabold text-white truncate">${player.username}</h2>
                        <p class="text-sm md:text-base text-gray-400 font-medium">
                            <span class="text-pink-400">${player.title}</span> <span class="text-gray-500">(${player.points} points)</span>
                        </p>
                    </div>
                    <div class="w-16 md:w-24 flex-shrink-0 text-center">
                        <span class="bg-red-600 text-white font-bold py-1 px-3 rounded-full text-xs">${player.region}</span>
                    </div>
                    <div class="flex-shrink-0 flex items-center justify-start space-x-2 md:space-x-4">
                        ${tiersHtml}
                    </div>
                `;
                rankingsContainer.appendChild(playerCard);
            });
        }

        searchInput.addEventListener('input', displayRankings);
        window.onload = fetchRankings;
    </script>
</body>
</html>
