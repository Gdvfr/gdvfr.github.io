<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McTiers - Rankings by _648k</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Catppuccin Macchiato palette for a consistent, calming dark theme */
        :root {
            --mocha-bg: #1e1e2e;
            --mocha-crust: #28283d;
            --mocha-surface: #313244;
            --mocha-border: #45475a;
            --mocha-text: #cdd6f4;
            --mocha-subtext: #bac2de;
            --mocha-blue: #89b4fa;
            --mocha-green: #a6da95;
            --mocha-gold: #f9e2af;
            --mocha-pink: #f4b8e4;
            --mocha-red: #f2cdcd;
            --mocha-lavender: #b7b7ff;
            --mocha-dark-text: #4c526f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--mocha-bg);
            color: var(--mocha-text);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1200px;
            padding: 2rem;
        }

        .card {
            background-color: var(--mocha-crust);
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 2.5rem;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }

        input[type="text"], select {
            background-color: var(--mocha-surface);
            border: 1px solid var(--mocha-border);
            color: var(--mocha-text);
            border-radius: 0.75rem;
            padding: 0.75rem 1.25rem;
            transition: border-color 0.2s, background-color 0.2s;
            appearance: none;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--mocha-blue);
            box-shadow: 0 0 0 2px rgba(137, 180, 250, 0.2);
        }

        .table-header {
            background-color: var(--mocha-surface);
            color: var(--mocha-subtext);
            font-weight: 700;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            letter-spacing: 0.05em;
        }
        
        .table-row {
            background-color: var(--mocha-crust);
            border-bottom: 1px solid var(--mocha-border);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .table-row:last-child {
            border-bottom: none;
        }
        .table-row:nth-child(even) {
            background-color: #2b2b40;
        }
        .table-row:hover {
            background-color: #313244;
            transform: scale(1.01);
        }

        .table-row td {
            padding: 1rem 1.5rem;
        }

        .tier-ht1 { color: var(--mocha-gold); text-shadow: 0 0 5px rgba(249, 226, 175, 0.4); }
        .tier-lt1 { color: #f2e7c4; }
        .tier-ht2 { color: var(--mocha-green); text-shadow: 0 0 5px rgba(166, 218, 149, 0.4); }
        .tier-lt2 { color: #b7e3a9; }
        .tier-ht3 { color: var(--mocha-pink); text-shadow: 0 0 5px rgba(244, 184, 228, 0.4); }
        .tier-lt3 { color: #ebacdb; }
        .tier-ht4 { color: var(--mocha-red); text-shadow: 0 0 5px rgba(242, 205, 205, 0.4); }
        .tier-lt4 { color: #e8c0c0; }
        .tier-ht5 { color: var(--mocha-lavender); text-shadow: 0 0 5px rgba(183, 183, 255, 0.4); }
        .tier-lt5 { color: #c4c4e7; }

        .loading-spinner {
            border: 4px solid var(--mocha-border);
            border-top: 4px solid var(--mocha-blue);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: var(--mocha-crust);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--mocha-surface);
            border-radius: 10px;
            border: 3px solid var(--mocha-crust);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #45475a;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen py-8">
    <div class="container mx-auto text-center">
        <h1 class="text-6xl font-extrabold mb-4 text-purple-300 drop-shadow-lg">McTiers Rankings</h1>
        <p class="text-xl mb-12 text-gray-400">
            The Official PvP Tier List for Minecraft 1.21.5+
            <br>
            Author: <span class="font-semibold text-pink-400 hover:text-pink-300 transition-colors duration-300">_648k</span>
        </p>

        <div class="card w-full max-w-5xl mx-auto mb-12">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <input type="text" id="searchInput" placeholder="Search by Username..." class="w-full">
                <select id="gamemodeFilter" class="w-full">
                    <option value="">All Gamemodes</option>
                    <option value="Sword">Sword</option>
                    <option value="Axe">Axe</option>
                    <option value="PotPvP">PotPvP</option>
                    <option value="Crystal">Crystal</option>
                    <option value="UHC">UHC</option>
                    <option value="SMP">SMP</option>
                    <option value="NethPot">NethPot</option>
                </select>
                <select id="tierFilter" class="w-full">
                    <option value="">All Tiers</option>
                    <option value="HT1">HT1</option>
                    <option value="LT1">LT1</option>
                    <option value="HT2">HT2</option>
                    <option value="LT2">LT2</option>
                    <option value="HT3">HT3</option>
                    <option value="LT3">LT3</option>
                    <option value="HT4">HT4</option>
                    <option value="LT4">LT4</option>
                    <option value="HT5">HT5</option>
                    <option value="LT5">LT5</option>
                </select>
            </div>

            <div id="loadingIndicator" class="flex flex-col justify-center items-center py-12">
                <div class="loading-spinner"></div>
                <p class="mt-4 text-gray-400 text-lg animate-pulse">Loading ranks...</p>
            </div>

            <div id="playerTableContainer" class="overflow-x-auto rounded-xl hidden">
                <table class="min-w-full divide-y divide-gray-700">
                    <thead>
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider table-header rounded-tl-xl">Rank</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider table-header">Username</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider table-header">Gamemode</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider table-header rounded-tr-xl">Tier</th>
                        </tr>
                    </thead>
                    <tbody id="playerTableBody" class="divide-y divide-gray-700">
                        </tbody>
                </table>
                <p id="noResults" class="text-center text-red-400 py-12 hidden text-lg">No players found matching your criteria.</p>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const gamemodeFilter = document.getElementById('gamemodeFilter');
        const tierFilter = document.getElementById('tierFilter');
        const playerTableBody = document.getElementById('playerTableBody');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const playerTableContainer = document.getElementById('playerTableContainer');
        const noResults = document.getElementById('noResults');

        let allRankings = []; // Store the fetched data, now with multiple rankings per player

        function getTierClass(tier) {
            switch(tier) {
                case 'HT1': return 'tier-ht1';
                case 'LT1': return 'tier-lt1';
                case 'HT2': return 'tier-ht2';
                case 'LT2': return 'tier-lt2';
                case 'HT3': return 'tier-ht3';
                case 'LT3': return 'tier-lt3';
                case 'HT4': return 'tier-ht4';
                case 'LT4': return 'tier-lt4';
                case 'HT5': return 'tier-ht5';
                case 'LT5': return 'tier-lt5';
                default: return '';
            }
        }

        async function fetchPlayerRankings() {
            loadingIndicator.classList.remove('hidden');
            playerTableContainer.classList.add('hidden');
            noResults.classList.add('hidden');

            try {
                // Fetch from a new data source that has multiple entries per player
                const response = await fetch('tiers_multi.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                allRankings = data.rankings; // Store fetched data
                displayRankings(); // Initial display
            } catch (error) {
                console.error("Could not fetch player rankings:", error);
                noResults.classList.remove('hidden');
                noResults.textContent = 'Failed to load player data. Please ensure tiers_multi.json is available.';
                playerTableContainer.classList.remove('hidden');
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        function displayRankings() {
            playerTableBody.innerHTML = '';
            noResults.classList.add('hidden');
            noResults.textContent = 'No rankings found matching your criteria.';

            const searchTerm = searchInput.value.toLowerCase();
            const selectedGamemode = gamemodeFilter.value;
            const selectedTier = tierFilter.value;

            let filteredRankings = allRankings.filter(ranking => {
                const matchesSearch = ranking.username.toLowerCase().includes(searchTerm);
                const matchesGamemode = selectedGamemode === '' || ranking.gamemode === selectedGamemode;
                const matchesTier = selectedTier === '' || ranking.tier === selectedTier;
                return matchesSearch && matchesGamemode && matchesTier;
            });

            // Sort rankings by tier and then by gamemode to keep a consistent look
            const tierOrder = ['HT1', 'LT1', 'HT2', 'LT2', 'HT3', 'LT3', 'HT4', 'LT4', 'HT5', 'LT5'];
            filteredRankings.sort((a, b) => {
                const tierAIndex = tierOrder.indexOf(a.tier);
                const tierBIndex = tierOrder.indexOf(b.tier);
                if (tierAIndex !== tierBIndex) {
                    return tierAIndex - tierBIndex;
                }
                return a.username.localeCompare(b.username);
            });

            if (filteredRankings.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }

            playerTableContainer.classList.remove('hidden');

            // This ensures the rank is a simple index number in this view
            filteredRankings.forEach((ranking, index) => {
                const row = document.createElement('tr');
                row.classList.add('table-row');
                row.innerHTML = `
                    <td class="px-6 py-3 whitespace-nowrap text-sm font-medium text-gray-300">${index + 1}</td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm font-semibold text-white">${ranking.username}</td>
                    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-400">${ranking.gamemode}</td>
                    <td class="px-6 py-3 whitespace-nowrap text-lg font-extrabold ${getTierClass(ranking.tier)}">${ranking.tier}</td>
                `;
                playerTableBody.appendChild(row);
            });
        }

        searchInput.addEventListener('input', displayRankings);
        gamemodeFilter.addEventListener('change', displayRankings);
        tierFilter.addEventListener('change', displayRankings);

        window.onload = fetchPlayerRankings;
    </script>
</body>
</html>
