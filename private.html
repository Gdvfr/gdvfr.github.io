<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
        font-family: 'Inter', sans-serif;
    }
    .video-card-container {
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      position: relative;
    }
    .video-card-container video, 
    .video-card-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <div class="container mx-auto p-4 md:p-8">
    
    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-2">Video Hub</h1>
      <p class="text-lg text-gray-400">Your personal video collection, saved in your browser.</p>
    </header>

    <!-- Folder and Upload Section -->
    <div class="bg-gray-800 p-6 sm:p-8 rounded-2xl shadow-xl mb-10 border border-gray-700">
      <div class="flex flex-col md:flex-row md:justify-between items-center space-y-4 md:space-y-0 md:space-x-8 mb-6">
          <!-- Folder Management -->
          <div class="w-full md:w-1/2">
              <h2 class="text-2xl font-bold mb-4 text-center text-gray-200">Create a Folder</h2>
              <div class="flex space-x-2">
                  <input type="text" id="folder-name-input" placeholder="Enter folder name" class="flex-grow p-2 rounded-lg bg-gray-700 text-gray-200 placeholder-gray-500 border border-gray-600 focus:ring-2 focus:ring-violet-500 focus:border-transparent">
                  <button id="create-folder-btn" onclick="createFolder()" class="px-6 py-2 bg-gradient-to-r from-pink-500 to-purple-500 text-white font-semibold rounded-full shadow-lg hover:from-pink-600 hover:to-purple-600 transition-colors duration-200 transform hover:scale-105">
                    Create
                  </button>
              </div>
          </div>
          <!-- Upload Section -->
          <div class="w-full md:w-1/2">
              <h2 class="text-2xl font-bold mb-4 text-center text-gray-200">Upload a File</h2>
              <div class="flex flex-col sm:flex-row items-center justify-center space-y-4 sm:space-y-0 sm:space-x-4">
                  <!-- FIX: Updated accept attribute to include .mov files -->
                  <input type="file" id="file-upload" accept="video/*,image/*,.mov" class="w-full sm:w-auto text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100 transition-colors duration-200">
                  <input type="text" id="file-desc" placeholder="Enter a description" class="w-full sm:flex-grow p-2 rounded-lg bg-gray-700 text-gray-200 placeholder-gray-500 border border-gray-600 focus:ring-2 focus:ring-violet-500 focus:border-transparent">
                  <div class="flex items-center space-x-2">
                      <button id="upload-btn" onclick="saveFile()" class="px-6 py-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold rounded-full shadow-lg hover:from-purple-600 hover:to-pink-600 transition-colors duration-200 transform hover:scale-105">
                        Upload
                      </button>
                      <div id="loading-indicator" class="hidden animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-purple-500"></div>
                  </div>
              </div>
          </div>
      </div>
      <!-- Folder List -->
      <div class="mt-6">
        <h3 class="text-lg font-semibold mb-2 text-gray-300">Folders</h3>
        <div id="folder-list" class="flex flex-wrap gap-2 text-sm">
          <!-- Folder buttons will be dynamically inserted here -->
        </div>
      </div>
    </div>

    <!-- Video Grid -->
    <div id="file-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- File cards will be dynamically inserted here -->
    </div>

    <!-- Custom Modal for Alerts and Confirmations -->
    <div id="modal-backdrop" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 backdrop-blur-sm z-40"></div>
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center transition-opacity duration-300">
        <div class="bg-gray-800 p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-700">
            <p id="modal-message" class="text-center text-lg mb-4"></p>
            <div class="flex justify-center space-x-4">
                <button id="modal-confirm" class="px-4 py-2 bg-green-600 text-white rounded-md shadow hover:bg-green-700 transition-colors duration-200 hidden">Confirm</button>
                <button id="modal-cancel" class="px-4 py-2 bg-gray-500 text-white rounded-md shadow hover:bg-gray-600 transition-colors duration-200 hidden">Cancel</button>
            </div>
        </div>
    </div>
  </div>
  <script>
    // --- In-Browser Storage Logic ---
    let videoHubData = {};
    let currentFolder = "uncategorized";
    const STORAGE_KEY = 'videoHubData';
    // FIX: Increased the file size limit to 50MB
    const MAX_FILE_SIZE_MB = 50;

    // Load data from localStorage on start
    function loadFromLocalStorage() {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            videoHubData = JSON.parse(data);
        } else {
            // Initialize with a default 'uncategorized' folder
            videoHubData = { folders: { "uncategorized": [] } };
        }
        renderFolders();
        renderFiles();
    }

    // Save data to localStorage
    function saveToLocalStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(videoHubData));
        renderFiles();
    }

    // --- UI Logic ---
    const modalContainer = document.getElementById('modal-container');
    const modalMessage = document.getElementById('modal-message');
    const modalConfirmBtn = document.getElementById('modal-confirm');
    const modalCancelBtn = document.getElementById('modal-cancel');

    function showModal(message, isConfirmation = false, onConfirm = null) {
        modalMessage.textContent = message;
        modalConfirmBtn.style.display = isConfirmation ? 'block' : 'none';
        modalCancelBtn.style.display = isConfirmation ? 'block' : 'none';
        modalContainer.classList.remove('hidden');
        document.getElementById('modal-backdrop').classList.remove('hidden');

        if (isConfirmation) {
            modalConfirmBtn.onclick = () => {
                modalContainer.classList.add('hidden');
                document.getElementById('modal-backdrop').classList.add('hidden');
                if (onConfirm) onConfirm();
            };
            modalCancelBtn.onclick = () => {
                modalContainer.classList.add('hidden');
                document.getElementById('modal-backdrop').classList.add('hidden');
            };
        } else {
            modalContainer.onclick = (e) => {
                if (e.target.id === 'modal-container') {
                    modalContainer.classList.add('hidden');
                    document.getElementById('modal-backdrop').classList.add('hidden');
                    modalContainer.onclick = null;
                }
            };
        }
    }

    // Renders all folder buttons
    function renderFolders() {
        const folderList = document.getElementById('folder-list');
        folderList.innerHTML = '';
        for (const folderName in videoHubData.folders) {
            addFolderButton(folderName);
        }
        updateActiveFolderButton();
    }

    // Renders files for the current folder
    function renderFiles() {
        const fileGrid = document.getElementById('file-grid');
        fileGrid.innerHTML = '';
        const files = videoHubData.folders[currentFolder] || [];
        
        if (files.length === 0) {
            fileGrid.innerHTML = `<div class="col-span-1 md:col-span-3 lg:col-span-3 text-center py-10 text-gray-400">
                <p class="text-xl">No files in this folder.</p>
                <p class="mt-2 text-md">Use the upload section above to add a video or image.</p>
            </div>`;
        } else {
            files.forEach((file, index) => {
                addFileCard(index, file.fileSrc, file.description, file.fileType);
            });
        }
    }

    // --- Core Functions ---
    window.createFolder = function() {
        const folderNameInput = document.getElementById('folder-name-input');
        const folderName = folderNameInput.value.trim();
        if (!folderName) {
            showModal("Please enter a folder name!");
            return;
        }

        if (videoHubData.folders[folderName]) {
            showModal("A folder with that name already exists!");
            return;
        }

        videoHubData.folders[folderName] = [];
        folderNameInput.value = '';
        saveToLocalStorage();
        renderFolders();
        showModal(`Folder "${folderName}" created!`);
    };

    window.saveFile = function() {
        const fileInput = document.getElementById('file-upload');
        const descInput = document.getElementById('file-desc');
        const uploadButton = document.getElementById('upload-btn');
        const loadingIndicator = document.getElementById('loading-indicator');

        if (fileInput.files.length === 0) {
            showModal("Please select a file to upload!");
            return;
        }

        const file = fileInput.files[0];
        const description = descInput.value || "No description provided.";
        const fileType = file.type;

        if (!fileType.startsWith('video/') && !fileType.startsWith('image/') && file.name.endsWith('.mov')) {
            showModal("The selected file is not a supported video or image type. Please upload a supported file type.");
            return;
        }
        
        if (file.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
             showModal(`The file is too large! Please upload a file smaller than ${MAX_FILE_SIZE_MB}MB.`);
             return;
        }

        uploadButton.classList.add('hidden');
        loadingIndicator.classList.remove('hidden');

        const reader = new FileReader();
        reader.onload = function(event) {
            const base64File = event.target.result;
            
            const newFile = {
                fileSrc: base64File,
                description: description,
                fileType: fileType,
                createdAt: new Date().toISOString()
            };

            videoHubData.folders[currentFolder].push(newFile);
            saveToLocalStorage();
            
            // Reset UI
            fileInput.value = "";
            descInput.value = "";
            uploadButton.classList.remove('hidden');
            loadingIndicator.classList.add('hidden');
            showModal("File uploaded successfully!");
        };

        reader.readAsDataURL(file);
    };

    window.deleteFile = function(fileIndex) {
        showModal("Are you sure you want to delete this file?", true, () => {
            if (videoHubData.folders[currentFolder]) {
                videoHubData.folders[currentFolder].splice(fileIndex, 1);
                saveToLocalStorage();
            }
        });
    };

    // --- Helper Functions ---
    function addFolderButton(folderName) {
        const folderList = document.getElementById('folder-list');
        const button = document.createElement('button');
        button.textContent = folderName;
        button.onclick = () => {
            currentFolder = folderName;
            renderFiles();
            updateActiveFolderButton();
        };
        button.className = 'folder-btn px-4 py-2 rounded-full border border-gray-700 hover:bg-gray-700 transition-colors duration-200';
        folderList.appendChild(button);
    }

    function updateActiveFolderButton() {
        const buttons = document.querySelectorAll('.folder-btn');
        buttons.forEach(btn => {
            if (btn.textContent === currentFolder) {
                btn.classList.add('bg-gray-700', 'ring-2', 'ring-purple-500', 'text-white');
                btn.classList.remove('text-gray-400');
            } else {
                btn.classList.remove('bg-gray-700', 'ring-2', 'ring-purple-500', 'text-white');
                btn.classList.add('text-gray-400');
            }
        });
    }

    function addFileCard(fileIndex, fileSrc, description, fileType) {
        const grid = document.getElementById('file-grid');
        const card = document.createElement('div');
        card.className = 'relative flex flex-col items-center bg-gray-800 rounded-xl overflow-hidden shadow-lg transform transition-transform duration-300 hover:scale-105 group';
        
        let mediaElement;
        // FIX: Replaced video and image elements with a unified container for consistent dimensions
        if (fileType.startsWith('video/') || fileType === 'video/quicktime') {
            mediaElement = `<div class="video-card-container">
                                <video controls>
                                    <source src="${fileSrc}" type="${fileType}">
                                    Your browser does not support the video tag.
                                </video>
                            </div>`;
        } else if (fileType.startsWith('image/')) {
            mediaElement = `<div class="video-card-container">
                                <img src="${fileSrc}" alt="${description}">
                            </div>`;
        } else {
            mediaElement = `<div class="w-full h-48 flex items-center justify-center text-gray-400">Unsupported File Type</div>`;
        }
        
        card.innerHTML = `
            ${mediaElement}
            <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 text-white cursor-pointer hover:scale-110 transition-transform duration-300">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.992 8.783L9.75 12.65a1.2 1.2 0 0 0 0 2.062l6.242 3.867A1.2 1.2 0 0 0 18 16.65V9.35a1.2 1.2 0 0 0-2.008-.567Z" />
                </svg>
            </div>
            <div class="p-4 w-full flex-grow">
                <p class="text-sm text-gray-400 truncate">${description}</p>
            </div>
            <button onclick="deleteFile('${fileIndex}')" class="absolute top-2 right-2 p-2 bg-red-600 hover:bg-red-700 rounded-full text-white shadow-lg transition-transform duration-200 transform hover:scale-110">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.328a4 4 0 0 0-4.04-4.04a4 4 0 0 0-4.04 4.04L6 10.74l-.346 9m-4.788 0a4 4 0 0 1-4.04-4.04a4 4 0 0 1-4.04 4.04" />
                </svg>
            </button>
        `;
        grid.appendChild(card);
    }
    
    // Initial page load
    window.onload = function() {
        loadFromLocalStorage();
    };
  </script>
</body>
</html>
