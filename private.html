<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, where, addDoc, getDocs, deleteField } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    
    // Global variables for Firebase setup
    let __firebase_config;
    let __initial_auth_token;
    let __app_id;

    // Check if variables are defined in the environment
    try {
        __firebase_config = firebaseConfig;
        __initial_auth_token = initialAuthToken;
        __app_id = appId;
    } catch (e) {
        console.warn("Firebase variables not found, using defaults for local development.");
        __firebase_config = {};
        __initial_auth_token = null;
        __app_id = 'default-app-id';
    }

    const firebaseConfig = JSON.parse(__firebase_config);
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let userId = null;

    // Custom modal UI to replace alert() and confirm()
    const modalContainer = document.getElementById('modal-container');
    const modalMessage = document.getElementById('modal-message');
    const modalConfirmBtn = document.getElementById('modal-confirm');
    const modalCancelBtn = document.getElementById('modal-cancel');
    const modalInput = document.getElementById('modal-input');
    
    function showModal(message, isConfirmation = false, onConfirm = null) {
        modalMessage.textContent = message;
        modalConfirmBtn.style.display = isConfirmation ? 'block' : 'none';
        modalCancelBtn.style.display = isConfirmation ? 'block' : 'none';
        modalContainer.classList.remove('hidden');

        if (isConfirmation) {
            modalConfirmBtn.onclick = () => {
                modalContainer.classList.add('hidden');
                if (onConfirm) onConfirm();
            };
            modalCancelBtn.onclick = () => {
                modalContainer.classList.add('hidden');
            };
        } else {
            // For simple alerts, clicking anywhere dismisses it
            modalContainer.onclick = (e) => {
                if (e.target.id === 'modal-container') {
                    modalContainer.classList.add('hidden');
                    modalContainer.onclick = null;
                }
            };
        }
    }

    // Auth state listener
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            userId = user.uid;
            document.getElementById('user-id-display').textContent = `User ID: ${userId}`;
            console.log("User signed in:", userId);
            setupFirestoreListener(userId);
        } else {
            console.log("No user signed in. Signing in...");
            try {
                if (__initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Error signing in:", error);
                showModal("There was an error connecting to the database. Please try again later.");
            }
        }
    });

    function setupFirestoreListener(uid) {
        const videosCollection = collection(db, `artifacts/${__app_id}/users/${uid}/videos`);
        onSnapshot(videosCollection, (snapshot) => {
            const videoGrid = document.getElementById('video-grid');
            videoGrid.innerHTML = '';
            snapshot.forEach((doc) => {
                const videoData = doc.data();
                addVideoCard(doc.id, videoData.videoSrc, videoData.description);
            });
        }, (error) => {
            console.error("Error getting videos:", error);
            showModal("Error loading videos. Please check your connection.");
        });
    }

    // Function to add a new video
    window.saveVideo = async function() {
        const fileInput = document.getElementById('video-upload');
        const descInput = document.getElementById('video-desc');
        const uploadButton = document.getElementById('upload-btn');
        const loadingIndicator = document.getElementById('loading-indicator');

        if (fileInput.files.length === 0) {
            showModal("Please select a video file to upload!");
            return;
        }

        const file = fileInput.files[0];
        if (!file.type.startsWith('video/')) {
            showModal("The selected file is not a video. Please upload a video file.");
            return;
        }

        // Show loading state
        uploadButton.classList.add('hidden');
        loadingIndicator.classList.remove('hidden');

        const reader = new FileReader();
        reader.onload = async function(event) {
            const base64Video = event.target.result;
            const description = descInput.value || "No description provided.";

            if (!userId) {
                showModal("Please wait for authentication to complete before uploading.");
                return;
            }

            const videosCollection = collection(db, `artifacts/${__app_id}/users/${userId}/videos`);
            try {
                await addDoc(videosCollection, {
                    videoSrc: base64Video,
                    description: description,
                    createdAt: new Date()
                });
            } catch (error) {
                console.error("Error uploading video:", error);
                showModal("Failed to upload video. Please try again.");
            } finally {
                // Reset UI
                fileInput.value = "";
                descInput.value = "";
                uploadButton.classList.remove('hidden');
                loadingIndicator.classList.add('hidden');
            }
        };

        reader.readAsDataURL(file);
    };

    // Function to delete a video
    window.deleteVideo = async function(docId) {
        if (!userId) {
            showModal("Please wait for authentication to complete.");
            return;
        }
        showModal("Are you sure you want to delete this video?", true, async () => {
            const videoDoc = doc(db, `artifacts/${__app_id}/users/${userId}/videos`, docId);
            try {
                await deleteDoc(videoDoc);
            } catch (error) {
                console.error("Error deleting video:", error);
                showModal("Failed to delete video. Please try again.");
            }
        });
    };

    // Function to clear all videos
    window.clearAllVideos = function() {
        showModal("This will delete ALL of your videos. Are you sure?", true, async () => {
            if (!userId) {
                showModal("Please wait for authentication to complete.");
                return;
            }
            try {
                const q = query(collection(db, `artifacts/${__app_id}/users/${userId}/videos`));
                const querySnapshot = await getDocs(q);
                const deletePromises = [];
                querySnapshot.forEach((doc) => {
                    deletePromises.push(deleteDoc(doc.ref));
                });
                await Promise.all(deletePromises);
            } catch (error) {
                console.error("Error clearing all videos:", error);
                showModal("Failed to clear all videos. Please try again.");
            }
        });
    };

    // Function to render a single video card
    function addVideoCard(docId, videoSrc, description) {
        const grid = document.getElementById('video-grid');
        const card = document.createElement('div');
        card.className = 'relative flex flex-col items-center bg-gray-800 rounded-xl overflow-hidden shadow-lg transform transition-transform duration-300 hover:scale-105 group';
        card.innerHTML = `
            <video class="w-full h-auto rounded-lg">
                <source src="${videoSrc}">
                Your browser does not support the video tag.
            </video>
            <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 text-white cursor-pointer hover:scale-110 transition-transform duration-300">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.992 8.783L9.75 12.65a1.2 1.2 0 0 0 0 2.062l6.242 3.867A1.2 1.2 0 0 0 18 16.65V9.35a1.2 1.2 0 0 0-2.008-.567Z" />
                </svg>
            </div>
            <div class="p-4 w-full flex-grow">
                <p class="text-sm text-gray-400 truncate">${description}</p>
            </div>
            <button onclick="deleteVideo('${docId}')" class="absolute top-2 right-2 p-2 bg-red-600 hover:bg-red-700 rounded-full text-white shadow-lg transition-transform duration-200 transform hover:scale-110">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.328a4 4 0 0 0-4.04-4.04a4 4 0 0 0-4.04 4.04L6 10.74l-.346 9m-4.788 0a4 4 0 0 1-4.04-4.04a4 4 0 0 1-4.04 4.04" />
                </svg>
            </button>
        `;
        grid.appendChild(card);

        // Add event listener to play video on hover/click
        const videoElement = card.querySelector('video');
        const overlay = card.querySelector('.absolute');
        card.addEventListener('mouseenter', () => videoElement.play());
        card.addEventListener('mouseleave', () => { videoElement.pause(); videoElement.currentTime = 0; });
        overlay.addEventListener('click', () => {
            videoElement.paused ? videoElement.play() : videoElement.pause();
        });
    }

    window.onload = function() {
        console.log("Welcome to the modern Video Hub!");
    };
  </script>
  <style>
    body {
        font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <div class="container mx-auto p-4 md:p-8">
    
    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-2">Video Hub</h1>
      <p class="text-lg text-gray-400">Your personal video collection, powered by a real-time database.</p>
      <p id="user-id-display" class="text-sm mt-2 text-gray-500"></p>
    </header>

    <!-- Upload Section -->
    <div class="bg-gray-800 p-6 sm:p-8 rounded-2xl shadow-xl mb-10 border border-gray-700">
      <h2 class="text-2xl font-bold mb-4 text-center text-gray-200">Upload a Video</h2>
      <div class="flex flex-col sm:flex-row items-center justify-center space-y-4 sm:space-y-0 sm:space-x-4">
        <input type="file" id="video-upload" accept="video/*" class="w-full sm:w-auto text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100 transition-colors duration-200">
        <input type="text" id="video-desc" placeholder="Enter a description" class="w-full sm:flex-grow p-2 rounded-lg bg-gray-700 text-gray-200 placeholder-gray-500 border border-gray-600 focus:ring-2 focus:ring-violet-500 focus:border-transparent">
        <div class="flex items-center space-x-2">
          <button id="upload-btn" onclick="saveVideo()" class="px-6 py-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold rounded-full shadow-lg hover:from-purple-600 hover:to-pink-600 transition-colors duration-200 transform hover:scale-105">
            Upload
          </button>
          <div id="loading-indicator" class="hidden animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-purple-500"></div>
          <button onclick="clearAllVideos()" class="px-6 py-2 bg-gray-700 text-gray-300 font-semibold rounded-full shadow-lg hover:bg-gray-600 transition-colors duration-200 transform hover:scale-105">
            Clear All
          </button>
        </div>
      </div>
    </div>

    <!-- Video Grid -->
    <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Video cards will be dynamically inserted here -->
    </div>

    <!-- Custom Modal for Alerts and Confirmations -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-75 backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-gray-800 p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-700">
            <p id="modal-message" class="text-center text-lg mb-4"></p>
            <div class="flex justify-center space-x-4">
                <button id="modal-confirm" class="px-4 py-2 bg-green-600 text-white rounded-md shadow hover:bg-green-700 transition-colors duration-200 hidden">Confirm</button>
                <button id="modal-cancel" class="px-4 py-2 bg-gray-500 text-white rounded-md shadow hover:bg-gray-600 transition-colors duration-200 hidden">Cancel</button>
            </div>
        </div>
    </div>

  </div>
</body>
</html>
